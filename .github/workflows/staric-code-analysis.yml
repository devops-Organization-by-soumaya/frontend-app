# ✅ Name of the Workflow
name: Pipeline CI/CD sonarqube-code-quality-scan-job.

# ✅ Trigger this workflow on pull request to main branch...
on:
  pull_request:
    branches:
      - main

# ✅ Global Environment Variables
env:
  BUILD_NUMBER: ${{ github.run_number }}  # Unique build number for the pipeline run
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:${{ github.run_number }}

jobs:

  sonarqube-code-quality-scan-job:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
    
  trivy-image-security-scan-job:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Run Trivy Docker image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  snyk-code-security-scan-job:
      runs-on: ubuntu-latest
      steps:

        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Install Dependency Scanning Tool (Snyk)
          run: npm install -g snyk

        - name: Snyk Authentication
          run: snyk auth ${{ secrets.SNYK_TOKEN }}

        - name: Run Snyk Vulnerability Scan
          run: snyk monitor --all-projects --org=assidiwassim

# ✅ Name of the workflow
name: Pipeline CI/CD sonarqube-code-quality-scan-job

# ✅ Trigger this workflow on pull requests to the main branch
on:
  pull_request:
    branches:
      - main

jobs:
  # 🔍 Job responsible for running the SonarQube code quality analysis
  sonarqube-code-quality-scan-job:

    # 🖥️ Run the job on the latest Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest

    steps:

      # 📥 Step 1: Clone the source code from the repository
      - name: Clone Source Code
        uses: actions/checkout@v4

      # 🟢 Step 2: Set up the Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          # Specify the Node.js version used by the project
          node-version: '18'

      # 📦 Step 3: Install all project dependencies
      - name: Install dependencies
        run: npm install

      # 🔎 Step 4: Run SonarQube code quality and security analysis
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          # 🔐 Authentication token used to connect to SonarQube
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          # 🌐 URL of the SonarQube server
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}