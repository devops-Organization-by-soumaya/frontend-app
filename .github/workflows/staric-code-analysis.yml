# ✅ Name of the workflow
name: Pipeline CI/CD sonarqube-code-quality-scan-job

# ✅ Trigger this workflow on pull requests to the main branch
on:
  pull_request:
    branches:
      - main

jobs:
  # 🔍 Job responsible for running the SonarQube code quality analysis
  sonarqube-code-quality-scan-job:

    # 🖥️ Run the job on the latest Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest

    steps:

      # 📥 Step 1: Clone the source code from the repository
      - name: Clone Source Code
        uses: actions/checkout@v4

      # 🟢 Step 2: Set up the Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          # Specify the Node.js version used by the project
          node-version: '18'

      # 📦 Step 3: Install all project dependencies
      - name: Install dependencies
        run: npm install

      # 🔎 Step 4: Run SonarQube code quality and security analysis
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          # 🔐 Authentication token used to connect to SonarQube
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          # 🌐 URL of the SonarQube server
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 🛡️ Job responsible for scanning the Docker image and filesystem for vulnerabilities
  trivy-image-security-scan-job:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: my-app:${{ github.sha }}

    steps:
      # 📥 Step 1: Clone the source code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🏗️ Step 2: Build the Docker image to be scanned
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      # 🔎 Step 3: Run Trivy vulnerability scan on the built Docker image
      - name: Run Trivy Docker image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 🔎 Step 4 (optional): Also scan the filesystem/repo itself
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

    snyk-code-security-scan-job:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependency Scanning Tool (Snyk)
        run: npm install -g snyk

      - name: Snyk Authentications
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Vulnerability Scan
        run: snyk monitor --all-projects --org=devops-Organization-by-soumaya
        